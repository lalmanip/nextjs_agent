# Dedicated host for the agent Next.js app (avoids sharing /_next with the "nextjs" pod).
#
# Prerequisites:
#   1. DNS: agent-next.vivancetravels.com -> your Kong / LB public IP
#   2. TLS: cert-manager or manual secret "nextjs-agent-agent-next-tls"
#   3. Service "nextjs-agent" exposes port 3005 (adjust if different)
#
# Apply (after editing service name/port):
#   kubectl apply -f k8s/nextjs-agent-agent-next-ingress.example.yaml
#
# If you use Kong Gateway (not nginx Ingress), create an equivalent Route:
#   host = agent-next.vivancetravels.com
#   paths = / (all)
#   upstream = Kubernetes Service nextjs-agent:3005
#   Do NOT attach the "nextjs" deployment to this host.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextjs-agent-agent-next-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - agent-next.vivancetravels.com
      secretName: nextjs-agent-agent-next-tls
  rules:
    - host: agent-next.vivancetravels.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nextjs-agent
                port:
                  number: 3005
