# Kong Ingress: agent-dev.vivancetravels.com -> nextjs-agent-svc (all paths).
# Pair with k8s/agent-dev-certificate.yaml for TLS.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextjs-agent-dev-ingress
  namespace: default
  annotations:
    konghq.com/strip-path: "false"
    konghq.com/protocols: "http,https"
    konghq.com/ssl-redirect: "true"
    konghq.com/https-redirect-status-code: "301"
    # Upload limit: configure kong-gateway env (see k8s/kong-gateway-upload-limit.md).
    # TLS secret from k8s/agent-dev-certificate.yaml (do not also rely on ingress-shim unless you remove the Certificate CR)
spec:
  ingressClassName: kong
  tls:
    - hosts:
        - agent-dev.vivancetravels.com
      secretName: agent-dev-vivancetravels-tls
  rules:
    - host: agent-dev.vivancetravels.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nextjs-agent-svc
                port:
                  number: 80
