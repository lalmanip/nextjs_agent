# Runtime env for deployment/nextjs-agent (merge into container env or envFrom).
# Build-time copy: same keys in .env.production for middleware host detection.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nextjs-agent-env
  namespace: default
  labels:
    app.kubernetes.io/name: nextjs-agent
data:
  NEXT_PUBLIC_AGENT_PORTAL_URL: "https://agent-dev.vivancetravels.com"
  NEXT_PUBLIC_B2C_APP_URL: "https://next.vivancetravels.com"
  AGENT_PORTAL_HOSTS: "agent-dev.vivancetravels.com"
  API_MODE: "remote"
  NEXT_PUBLIC_API_MODE: "remote"
