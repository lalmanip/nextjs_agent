name: Deploy Next.js to Kubernetes (Dev)

on:
  push:
    branches:
      - dev

env:
  IMAGE_NAME: vivance/nextjs-agent-app
  DEPLOYMENT_NAME: nextjs-agent
  IMAGE_TAG: dev-${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.dev
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:dev-latest

      - name: Deploy to Kubernetes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            IMAGE_TAG=${{ env.IMAGE_TAG }}
            IMAGE_NAME=${{ env.IMAGE_NAME }}

            echo "Deploying $IMAGE_NAME:$IMAGE_TAG"

            kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} \
              nextjs-agent=$IMAGE_NAME:$IMAGE_TAG

            kubectl annotate deployment/${{ env.DEPLOYMENT_NAME }} \
              kubernetes.io/change-cause="Deploy dev-${GITHUB_SHA} via GitHub Actions" \
              --overwrite
            kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }}
